<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#b9d7e7">
  <title>Tiny Myrmidon 3D</title>
  <link rel="stylesheet" href="./styles/base.css">
  <link rel="stylesheet" href="./styles/hud.css">
  <link rel="stylesheet" href="./styles/modals.css">
  <link rel="stylesheet" href="./styles/joystick.css">
</head>
<body>
  <main>
    <section id="hud" aria-label="Battle status">
      <div class="bar-wrap">
        <span class="bar-label">Vitality</span>
        <div class="bar-bg"><div id="hp-bar"></div></div>
        <span id="hp-label">100 / 100</span>
      </div>

      <div class="bar-wrap">
        <span class="bar-label">Aether</span>
        <div class="bar-bg"><div id="xp-bar"></div></div>
        <span id="xp-label">0 / 5 XP</span>
      </div>

      <div class="hud-footer">
        <span id="level-value">1</span>
        <div id="stats">0 defeated · 0 renown</div>
        <div id="cooldown-wrap">
          <span>SPEAR</span>
          <span id="cooldown-track"><span id="cooldown-fill"></span></span>
        </div>
      </div>
    </section>

    <div id="control-hint" aria-label="Keyboard controls">
      <span class="hint-title">MOVE</span>
      <kbd>Z</kbd><kbd>Q</kbd><kbd>S</kbd><kbd>D</kbd>
      <span class="hint-separator">·</span>
      <span>ARROWS / WASD ALSO WORK</span>
    </div>

    <button id="pause-btn" type="button">PAUSE</button>
    <div id="wave-announcement" aria-live="polite"></div>

    <section id="pause-modal" aria-label="Pause menu">
      <div class="modal-box">
        <span class="modal-kicker">THE ARENA IS SILENT</span>
        <h1>PAUSED</h1>
        <button id="resume-btn" type="button">RETURN TO BATTLE</button>
        <button id="pause-restart-btn" type="button">RESTART RUN</button>
      </div>
    </section>

    <section id="upgrade-modal" class="modal-overlay" aria-label="Choose an upgrade">
      <h2 class="modal-title">Olympian Favor! Choose a Blessing</h2>
      <div class="cards" id="cards"></div>
    </section>

    <section id="gameover-modal" class="modal-overlay" aria-label="Game over">
      <div class="modal-box">
        <h1 class="modal-title">The Myrmidon Has Fallen!</h1>
        <p id="final-score" class="final-score"></p>

        <div class="form-row" id="score-form">
          <input
            type="text"
            id="player-name"
            placeholder="Hero Name (e.g. Achilles)"
            maxlength="24"
            autocomplete="off"
          >
          <button id="submit-score-btn" type="button">Record Legend</button>
        </div>
        <p id="submit-status" class="submit-status" aria-live="polite"></p>

        <h2 class="leaderboard-title">Hero Leaderboard</h2>
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col">Hero</th>
              <th scope="col">Score</th>
              <th scope="col">Wave</th>
            </tr>
          </thead>
          <tbody id="leaderboard-body">
            <tr><td colspan="4" class="table-empty">Loading...</td></tr>
          </tbody>
        </table>

        <button type="button" id="restart-btn" class="restart-button">Fight Again</button>
      </div>
    </section>

    <div id="joystick-base" aria-hidden="true">
      <div id="joystick-knob"></div>
    </div>
  </main>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
      },
      "integrity": {
        "https://unpkg.com/three@0.169.0/build/three.module.js": "sha384-qOubuRxWZ0I7rXTjcuhcKNHKvPM7q0ztN8/82sJnxnyKS0OXTeB5FsIcysc2T9EY"
      }
    }
  </script>
  <script type="module" src="./js/loop.js"></script>
</body>
</html>
