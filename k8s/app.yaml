apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-myrmidon-game
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiny-myrmidon-game
  template:
    metadata:
      labels:
        app: tiny-myrmidon-game
    spec:
      containers:
        - name: game
          image: tiny-myrmidon-game:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: tiny-myrmidon-game
spec:
  selector:
    app: tiny-myrmidon-game
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tiny-myrmidon-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tiny-myrmidon-api
  template:
    metadata:
      labels:
        app: tiny-myrmidon-api
    spec:
      containers:
        - name: api
          image: tiny-myrmidon-api:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "25m"
              memory: "16Mi"
            limits:
              cpu: "250m"
              memory: "64Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 2
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: tiny-myrmidon-api
spec:
  selector:
    app: tiny-myrmidon-api
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tiny-myrmidon-ingress
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: tiny-myrmidon-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tiny-myrmidon-game
                port:
                  number: 80