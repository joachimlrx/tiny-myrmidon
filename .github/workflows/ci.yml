name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  rust-check:
    name: Rust Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: api

      - name: Check code formatting
        run: cargo fmt --all -- --check
        working-directory: api

      - name: Run Clippy linter
        run: cargo clippy --all-targets -- -D warnings
        working-directory: api

      - name: Run automated test suite
        run: cargo test --all --verbose
        working-directory: api

  security-audit:
    name: DevSecOps Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Audit Cargo.lock for known CVEs (RustSec)
        run: cargo audit
        working-directory: api

      - name: Enforce Kubernetes security hardening policies
        run: |
          python3 -c "
          import yaml
          docs = list(yaml.safe_load_all(open('k8s/app.yaml')))
          deployments = {d['metadata']['name']: d for d in docs if d.get('kind') == 'Deployment'}
          api = deployments['tiny-myrmidon-api']['spec']['template']['spec']['containers'][0]
          sec = api.get('securityContext', {})
          assert sec.get('runAsNonRoot') is True, 'API must set runAsNonRoot: true'
          assert sec.get('readOnlyRootFilesystem') is True, 'API must set readOnlyRootFilesystem: true'
          assert sec.get('allowPrivilegeEscalation') is False, 'API must forbid privilege escalation'
          assert 'ALL' in sec.get('capabilities', {}).get('drop', []), 'API must drop ALL capabilities'
          for name, dep in deployments.items():
              c = dep['spec']['template']['spec']['containers'][0]
              limits = c.get('resources', {}).get('limits', {})
              assert 'cpu' in limits and 'memory' in limits, f'{name} missing resource limits'
              policy = next(d for d in docs if d.get('kind') == 'NetworkPolicy' and d['spec']['podSelector']['matchLabels']['app'] == name)
              peers = policy['spec']['ingress'][0].get('from', [])
              assert any(
                  peer.get('namespaceSelector', {}).get('matchLabels', {}).get('kubernetes.io/metadata.name') == 'kube-system'
                  and peer.get('podSelector', {}).get('matchLabels', {}).get('app.kubernetes.io/name') == 'traefik'
                  for peer in peers
              ), f'{name} must only accept ingress from Traefik'
          pvc = next(d for d in docs if d.get('kind') == 'PersistentVolumeClaim')
          assert pvc['metadata']['name'] == 'tiny-myrmidon-leaderboard'
          assert pvc['spec']['accessModes'] == ['ReadWriteOnce']
          print('Kubernetes hardening and persistent volume assertions passed!')
          "

      - name: Verify frontend XSS protection
        run: |
          python3 -c "
          import pathlib
          for path in pathlib.Path('game/js').glob('*.js'):
              text = path.read_text()
              for line_no, line in enumerate(text.splitlines(), 1):
                  if 'innerHTML' in line and '\${' in line and 'escapeHtml' not in line:
                      raise AssertionError(f'Unescaped innerHTML interpolation in {path}:{line_no}')
          print('Frontend XSS check passed!')
          "

  docker-and-k8s:
    name: Docker Image & Manifest Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build API Docker image
        run: docker build -t tiny-myrmidon-api:ci api/

      - name: Verify API image runs as non-root user
        run: |
          USER_ID=$(docker inspect --format='{{.Config.User}}' tiny-myrmidon-api:ci)
          echo "Configured container user: $USER_ID"
          test "$USER_ID" = "10001"

      - name: Build Game Docker image
        run: docker build -t tiny-myrmidon-game:ci game/

      - name: Enforce Docker image size budgets
        shell: bash
        run: |
          set -euo pipefail
          check_image_size() {
            local image="$1"
            local max_bytes="$2"
            local size_bytes
            size_bytes=$(docker image inspect --format='{{.Size}}' "$image")
            echo "$image: $((size_bytes / 1024 / 1024)) MiB (limit: $((max_bytes / 1024 / 1024)) MiB)"
            if [ "$size_bytes" -gt "$max_bytes" ]; then
              echo "::error::$image exceeds its uncompressed image size budget"
              return 1
            fi
          }
          check_image_size tiny-myrmidon-api:ci $((20 * 1024 * 1024))
          check_image_size tiny-myrmidon-game:ci $((25 * 1024 * 1024))

      - name: Validate Kubernetes manifests
        run: |
          python3 -c "import yaml; docs = list(yaml.safe_load_all(open('k8s/app.yaml'))); assert docs and all('apiVersion' in d and 'kind' in d and 'name' in d.get('metadata', {}) for d in docs)"

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: |
          for script in game/js/*.js; do
            echo "Checking $script"
            node --input-type=module --check < "$script"
          done
          node --check scripts/load-test.mjs

      - name: Generate API image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: tiny-myrmidon-api:ci
          format: spdx-json
          artifact-name: tiny-myrmidon-api-sbom

      - name: Generate Game image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: tiny-myrmidon-game:ci
          format: spdx-json
          artifact-name: tiny-myrmidon-game-sbom


  browser-smoke:
    name: Browser Gameplay Smoke Tests
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Install pinned Playwright package
        run: npm install --no-save --no-package-lock playwright@1.65.1

      - name: Start the game and run browser smoke tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 4173 --directory game >/tmp/tiny-myrmidon-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            sleep 1
          done
          node tests/browser-smoke.mjs
